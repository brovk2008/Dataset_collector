name: Build & Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
        continue-on-error: true

      - name: Pre-download sentence-transformers model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
        continue-on-error: true

      - name: Build with PyInstaller
        run: |
          pyinstaller dataset_collector.spec
        continue-on-error: true

      - name: Calculate SHA256 (if exe exists)
        run: |
          if (Test-Path "dist/dataset_collector/dataset_collector.exe") {
            certutil -hashfile "dist/dataset_collector/dataset_collector.exe" SHA256 > dist/dataset_collector.exe.sha256
          } else {
            echo "No executable found at dist/dataset_collector/dataset_collector.exe"
          }
        shell: powershell
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/dataset_collector/dataset_collector.exe
            dist/dataset_collector.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

