name: Build Multi-Platform Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows EXE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller dataset_collector.spec --distpath ./dist_windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist_windows/dataset_collector/

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    name: Create GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release_files

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}

          # Find the executable
          EXE_FILE=$(find release_files -name "*.exe" -type f | head -1)

          if [ -f "$EXE_FILE" ]; then
            gh release create $TAG_NAME "$EXE_FILE" \
              --title "Dataset Collector $TAG_NAME" \
              --generate-notes
          else
            echo "ERROR: No EXE file found!"
            exit 1
          fi
