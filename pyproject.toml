[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-collector"
version = "1.0.0"
description = "Dataset discovery, analysis, and download platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dataset_Collector Contributors"}]
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pandas>=2.1.0",
    "Pillow>=10.0.0",
    "langdetect>=1.0.9",
    "pyyaml>=6.0.1",
    "humanize>=4.9.0",
    "aiofiles>=23.2.1",
    "kaggle>=1.6.0",
    "cryptography>=42.0.0",
]

[project.scripts]
dataset-collector = "dataset_collector.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataset_collector = ["config/*.yaml", "ui/styles/*.qss"]
